[project]
name = "churn-platform-django"
version = "0.1.0"
description = "Customer intelligence ML platform (Django + DRF + scikit-learn/XGBoost/SHAP)"
readme = "README.md"
authors = [
    { name = "Sohel ali", email = "sasalisayyed@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "celery>=5.6.3",
    "dj-database-url>=3.1.2",
    "django>=6.1.1",
    "djangorestframework>=3.18.1",
    "faker>=40.0.0",
    "gunicorn>=26.2.0",
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "psycopg2-binary>=2.9.13",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "whitenoise>=6.12.0",
    "xgboost-cpu>=3.4.1",
]

# This is a Django project, not an installable package: tell uv not to build it.
[tool.uv]
package = false
