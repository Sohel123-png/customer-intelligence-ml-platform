# Render Blueprint: New + > Blueprint > connect this repo.
databases:
  - name: customer-intel-db
    databaseName: customer_intel
    user: customer_intel
    plan: free

services:
  - type: web
    name: customer-intelligence
    runtime: python
    plan: free
    # `bash build.sh` (not ./build.sh) so it works even if the exec bit was lost on Windows.
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: customer-intel-db
          property: connectionString
      - key: DEMO_CUSTOMERS
        value: "1500"
